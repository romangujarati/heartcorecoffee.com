<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HeartCore Coffee — Specialty brewed and served from India's roots. Coming soon to Mumbai." />
  <meta property="og:title" content="HeartCore Coffee — Brewing Soon" />
  <meta property="og:description" content="Specialty brewed and served from India's roots." />
  <meta property="og:url" content="https://www.heartcorecoffee.com" />
  <title>HeartCore Coffee — Brewing Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Raleway:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --saffron: #E8612A;
      --ivory:   #FDF6EC;
      --gold:    #F2A81D;
      --white:   #FFFFFF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--saffron); font-family: 'Raleway', sans-serif; overflow-x: hidden; }

    /* GUJARATI PATTERN LAYER */
    .pattern-bg { position: fixed; inset: 0; z-index: 0; opacity: 0.13; pointer-events: none; }
    .pattern-bg svg { width: 100%; height: 100%; }

    /* ROGAN BORDER */
    .rogan-border { position: fixed; left: 0; right: 0; height: 5px; z-index: 10; background: repeating-linear-gradient(90deg, var(--gold) 0px, var(--gold) 10px, transparent 10px, transparent 14px, var(--ivory) 14px, var(--ivory) 18px, transparent 18px, transparent 24px); opacity: 0.9; }
    .rogan-border.top { top: 0; }
    .rogan-border.bottom { bottom: 0; }

    /* LAYOUT */
    .page { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px; text-align: center; color: var(--white); }

    /* LOGO */
    .logo-wrap { margin-bottom: 28px; animation: fadeDown 0.9s ease both; }
    .logo-stacked { font-family: 'Noto Sans Devanagari', 'Raleway', sans-serif; font-weight: 400; font-size: clamp(36px, 8vw, 72px); line-height: 1.1; letter-spacing: 0.04em; color: var(--white); display: block; }
    .logo-sub { font-weight: 600; font-size: clamp(11px, 2vw, 14px); letter-spacing: 0.38em; text-transform: uppercase; color: rgba(255,255,255,0.82); margin-top: 10px; }

    /* STEAM */
    .steam-wrap { width: 100px; height: 70px; margin: 0 auto 24px; animation: fadeUp 1s ease 0.2s both; }
    .steam-wrap svg { width: 100%; height: 100%; overflow: visible; }
    .sp { fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 80; stroke-dashoffset: 80; animation: steamRise 2.6s ease-in-out infinite; }
    .sp:nth-child(1) { animation-delay: 0s; }
    .sp:nth-child(2) { animation-delay: 0.85s; stroke: rgba(255,255,255,0.38); }
    .sp:nth-child(3) { animation-delay: 1.7s;  stroke: rgba(255,255,255,0.48); }
    @keyframes steamRise { 0% { stroke-dashoffset: 80; opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 85% { opacity: 0.5; } 100% { stroke-dashoffset: 0; opacity: 0; transform: translateY(-18px); } }

    /* TAGLINE */
    .tagline { font-weight: 700; font-size: clamp(10px, 2vw, 12px); letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.88); margin-bottom: 48px; animation: fadeUp 0.9s ease 0.4s both; }

    /* HERO */
    .hero-text { font-family: 'Playfair Display', serif; font-weight: 700; font-size: clamp(54px, 13vw, 116px); line-height: 0.93; letter-spacing: -0.02em; color: var(--white); margin-bottom: 24px; animation: fadeUp 0.9s ease 0.6s both; }
    .divider { width: 44px; height: 3px; background: rgba(255,255,255,0.38); border-radius: 2px; margin: 0 auto 48px; animation: fadeUp 0.9s ease 0.85s both; }

    /* SOCIAL */
    .social-row { display: flex; align-items: center; gap: 18px; margin-top: 48px; animation: fadeUp 0.9s ease 1.1s both; }
    .social-link { font-size: 11px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255,255,255,0.68); text-decoration: none; transition: color 0.2s; }
    .social-link:hover { color: var(--white); }
    .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.38); }

    /* FOOTER */
    .footer-line { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.32); white-space: nowrap; z-index: 10; }

    @keyframes fadeDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(18px);  } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) { .social-row { flex-wrap: wrap; justify-content: center; gap: 12px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>

  <div class="rogan-border top"></div>
  <div class="rogan-border bottom"></div>

  <!-- GUJARATI PATTERN BACKGROUND: Ajrakh + Bandhani + Patola SVG tiles -->
  <div class="pattern-bg">
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <defs>

        <!-- AJRAKH: 8-pointed star medallion tile (120×120) -->
        <pattern id="ajrakh" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
          <polygon points="60,4 116,60 60,116 4,60" fill="none" stroke="#fff" stroke-width="1.2"/>
          <polygon points="60,20 100,60 60,100 20,60" fill="none" stroke="#fff" stroke-width="0.8"/>
          <polygon points="60,28 68,52 92,52 73,67 80,91 60,77 40,91 47,67 28,52 52,52" fill="none" stroke="#fff" stroke-width="1"/>
          <circle cx="60" cy="60" r="8" fill="none" stroke="#fff" stroke-width="1"/>
          <circle cx="60" cy="60" r="3" fill="#fff"/>
          <circle cx="60" cy="6"   r="2" fill="#fff"/>
          <circle cx="114" cy="60" r="2" fill="#fff"/>
          <circle cx="60" cy="114" r="2" fill="#fff"/>
          <circle cx="6"  cy="60"  r="2" fill="#fff"/>
          <polygon points="60,36 65,44 60,52 55,44" fill="#fff"/>
          <line x1="60" y1="52" x2="60" y2="56" stroke="#fff" stroke-width="0.6"/>
          <line x1="60" y1="64" x2="60" y2="68" stroke="#fff" stroke-width="0.6"/>
          <line x1="52" y1="60" x2="56" y2="60" stroke="#fff" stroke-width="0.6"/>
          <line x1="64" y1="60" x2="68" y2="60" stroke="#fff" stroke-width="0.6"/>
        </pattern>

        <!-- BANDHANI: classic resist-dot field (40×40) -->
        <pattern id="bandhani" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
          <circle cx="8"  cy="8"  r="2"   fill="#fff"/>
          <circle cx="20" cy="8"  r="2"   fill="#fff"/>
          <circle cx="32" cy="8"  r="2"   fill="#fff"/>
          <circle cx="8"  cy="20" r="2"   fill="#fff"/>
          <circle cx="20" cy="20" r="4"   fill="none" stroke="#fff" stroke-width="1.2"/>
          <circle cx="20" cy="20" r="1.5" fill="#fff"/>
          <circle cx="32" cy="20" r="2"   fill="#fff"/>
          <circle cx="8"  cy="32" r="2"   fill="#fff"/>
          <circle cx="20" cy="32" r="2"   fill="#fff"/>
          <circle cx="32" cy="32" r="2"   fill="#fff"/>
        </pattern>

        <!-- PATOLA: concentric diamond ikat grid (80×80) -->
        <pattern id="patola" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
          <polygon points="40,2 78,40 40,78 2,40"   fill="none" stroke="#fff" stroke-width="1.1"/>
          <polygon points="40,14 66,40 40,66 14,40" fill="none" stroke="#fff" stroke-width="0.75"/>
          <polygon points="40,26 54,40 40,54 26,40" fill="none" stroke="#fff" stroke-width="0.6"/>
          <circle cx="40" cy="40" r="4.5" fill="none" stroke="#fff" stroke-width="0.8"/>
          <circle cx="40" cy="40" r="1.8" fill="#fff"/>
          <circle cx="2"  cy="2"  r="2.5" fill="none" stroke="#fff" stroke-width="0.8"/>
          <circle cx="78" cy="2"  r="2.5" fill="none" stroke="#fff" stroke-width="0.8"/>
          <circle cx="2"  cy="78" r="2.5" fill="none" stroke="#fff" stroke-width="0.8"/>
          <circle cx="78" cy="78" r="2.5" fill="none" stroke="#fff" stroke-width="0.8"/>
          <line x1="40" y1="2"  x2="40" y2="11" stroke="#fff" stroke-width="0.7"/>
          <line x1="40" y1="69" x2="40" y2="78" stroke="#fff" stroke-width="0.7"/>
          <line x1="2"  y1="40" x2="11" y2="40" stroke="#fff" stroke-width="0.7"/>
          <line x1="69" y1="40" x2="78" y2="40" stroke="#fff" stroke-width="0.7"/>
        </pattern>

        <!-- COMPOSITE: 3×3 checkerboard of all three patterns (360×360) -->
        <pattern id="composite" x="0" y="0" width="360" height="360" patternUnits="userSpaceOnUse">
          <rect x="0"   y="0"   width="120" height="120" fill="url(#ajrakh)"/>
          <rect x="120" y="0"   width="120" height="120" fill="url(#bandhani)"/>
          <rect x="240" y="0"   width="120" height="120" fill="url(#patola)"/>
          <rect x="0"   y="120" width="120" height="120" fill="url(#patola)"/>
          <rect x="120" y="120" width="120" height="120" fill="url(#ajrakh)"/>
          <rect x="240" y="120" width="120" height="120" fill="url(#bandhani)"/>
          <rect x="0"   y="240" width="120" height="120" fill="url(#bandhani)"/>
          <rect x="120" y="240" width="120" height="120" fill="url(#patola)"/>
          <rect x="240" y="240" width="120" height="120" fill="url(#ajrakh)"/>
        </pattern>

      </defs>
      <rect width="100%" height="100%" fill="url(#composite)"/>
    </svg>
  </div>

  <main class="page">

    <div class="logo-wrap">
      <div class="logo-stacked" aria-label="HeartCore Coffee">हार्टकोर कॉफ़ी</div>
      <p class="tagline">Specialty brewed and served from India's roots.</p>
    </div>

    <div class="steam-wrap" aria-hidden="true">
      <svg viewBox="0 0 100 70" preserveAspectRatio="xMidYMid meet">
        <path class="sp" d="M25 68 C22 56 32 48 27 36 C22 24 32 15 25 4"/>
        <path class="sp" d="M50 68 C53 54 43 46 49 33 C55 20 45 13 50 2"/>
        <path class="sp" d="M75 68 C72 57 82 49 76 37 C70 25 80 16 75 4"/>
      </svg>
    </div>

    <h1 class="hero-text">Brewing soon.</h1>

    <div class="divider"></div>

    <nav class="social-row" aria-label="Social links">
      <a class="social-link" href="https://www.instagram.com/heartcore.coffee" target="_blank" rel="noopener">Instagram</a>
      <div class="dot" aria-hidden="true"></div>
      <a class="social-link" href="mailto:hello@heartcorecoffee.com">hello@heartcorecoffee.com</a>
      <div class="dot" aria-hidden="true"></div>
      <a class="social-link" href="https://www.heartcorecoffee.com">Mumbai, India</a>
    </nav>

  </main>

  <p class="footer-line">© 2025 HeartCore Coffee &nbsp;·&nbsp; हार्टकोर कॉफ़ी</p>

  

</body>
</html>
